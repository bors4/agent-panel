<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06060f" />
    <title>AI Agent Control Panel — Mission Control</title>
    <meta
      name="description"
      content="Mission control for your local AI agent: Telegram bot, voice input, file tools, and OpenRouter support. Built for low-resource, self-hosted deployments."
    />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Agent Control Panel — Mission Control" />
    <meta
      property="og:description"
      content="Mission control for your local AI agent: Telegram bot, voice input, file tools, and OpenRouter support."
    />
    <meta property="og:locale" content="ru_RU" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI Agent Control Panel — Mission Control" />
    <meta
      name="twitter:description"
      content="Mission control for your local AI agent: Telegram bot, voice input, file tools, and OpenRouter support."
    />

    <script>
      // Inline theme application: runs BEFORE CSS loads, so the correct theme
      // is applied to <html> on the very first paint. Eliminates FOUC when
      // a saved theme differs from the default. Mirrors readTheme/applyTheme
      // from src/composables/useTheme.js — keep both in sync.
      (function () {
        try {
          var VALID = ["light", "dark", "system"];
          var t = localStorage.getItem("app-theme");
          if (!VALID.includes(t)) {
            var legacy = localStorage.getItem("theme");
            t = legacy === "light" ? "light" : "dark";
          }
          if (t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* keep default data-theme from <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
